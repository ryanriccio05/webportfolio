<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Ryan Riccio's October 2026 resume." />
        <meta name="author" content="Ryan Riccio" />
        <title>Resume | Ryan Riccio</title>
        <link rel="icon" href="assets/resume.png" />
        <link rel="stylesheet" href="css/resume-style.css" />
    </head>
    <body>
        <header class="resume-bar">
            <nav class="resume-nav" aria-label="Resume navigation">
                <a class="home-link" href="index.html">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7M5 12h14" /></svg>
                    <span>Portfolio</span>
                </a>
                <h1 id="resume-title">My Resume</h1>
                <div class="resume-actions">
                    <a class="pdf-link" href="assets/RyanRiccioResume_Oct2026.pdf" aria-label="Open PDF" title="Open PDF">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Zm-1 0v6h6M8 13h8m-8 4h8" /></svg>
                        <span>Open PDF</span>
                    </a>
                    <a class="download-link" href="assets/RyanRiccioResume_Oct2026.pdf" download aria-label="Download resume PDF" title="Download resume PDF">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m-5 7 5 5 5-5M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" /></svg>
                    </a>
                </div>
            </nav>
        </header>

        <main class="desk" aria-labelledby="resume-title">
            <div class="print-station">
                <div class="printer" aria-hidden="true">
                    <div class="printer-feed"></div>
                    <div class="printer-body">
                        <div class="printer-top">
                            <span class="printer-vents"></span>
                            <span class="printer-light"></span>
                        </div>
                        <div class="printer-slot"></div>
                    </div>
                </div>

                <div class="print-output">
                    <img class="resume-sheet" src="assets/RyanRiccioResume_Oct2026-preview.png"
                        width="1360" height="1760" alt="Printed preview of Ryan Riccio's October 2026 resume. The full document is available through the Open PDF link." />
                </div>

                <div class="desk-pencil" aria-hidden="true"></div>
                <div class="desk-notepad" aria-hidden="true"></div>
            </div>
        </main>
    </body>
</html>
