<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Web Schedule Project" />
        <meta name="author" content="Ryan Riccio" />
        <title>Web Portfolio</title>
        <!-- Favicon-->
        <link rel="icon" href="assets/syllabusicon.png">
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />
        <link href="css/styles copy.css" rel="stylesheet"/>
    </head>
    <body>
        <div class="d-flex" id="wrapper">
            <!-- Shared sidebar-->
            <div data-site-include="site-sidebar"></div>
            <!-- Page content wrapper-->
            <div id="page-content-wrapper">
                <!-- Shared top navigation-->
                <div data-site-include="site-header"></div>
                <!-- Page content-->
                <div class="container-fluid">
                    <br>
                        <h2 class="text-center">Spring 2025 Syllabi</h2>
                    <br>
                        <div class="accordion" id="pdfAccordion">
                            <!-- Button 1 -->
                            <div class="accordion-item">
                                <h2 class="accordion-header" id="headingOne">
                                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#pdf1" aria-expanded="true" aria-controls="pdf1">
                                        Computer Systems II
                                    </button>
                                </h2>
                                <div id="pdf1" class="accordion-collapse collapse" aria-labelledby="headingOne" data-bs-parent="#pdfAccordion">
                                    <div class="accordion-body">
                                        <embed src="assets/systemsIIsylly.pdf" type="application/pdf" width="100%" height="500px">
                                    </div>
                                </div>
                            </div>
                            <!-- Button 2 -->
                            <div class="accordion-item">
                                <h2 class="accordion-header" id="headingTwo">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#pdf2" aria-expanded="false" aria-controls="pdf2">
                                        Linear Algebra for Computing
                                    </button>
                                </h2>
                                <div id="pdf2" class="accordion-collapse collapse" aria-labelledby="headingTwo" data-bs-parent="#pdfAccordion">
                                    <div class="accordion-body">
                                        <embed src="assets/linearalgebrasylly.pdf" type="application/pdf" width="100%" height="500px">
                                    </div>
                                </div>
                            </div>
                            <!-- Button 3 -->
                            <div class="accordion-item">
                                <h2 class="accordion-header" id="headingThree">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#pdf3" aria-expanded="false" aria-controls="pdf3">
                                        Principles of Database Systems
                                    </button>
                                </h2>
                                <div id="pdf3" class="accordion-collapse collapse" aria-labelledby="headingThree" data-bs-parent="#pdfAccordion">
                                    <div class="accordion-body">
                                        <embed src="assets/databasesylly.pdf" type="application/pdf" width="100%" height="500px">
                                    </div>
                                </div>
                            </div>
                            <!-- Button 4 -->
                            <div class="accordion-item">
                                <h2 class="accordion-header" id="headingFour">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#pdf4" aria-expanded="false" aria-controls="pdf4">
                                        General Chemistry I
                                    </button>
                                </h2>
                                <div id="pdf4" class="accordion-collapse collapse" aria-labelledby="headingFour" data-bs-parent="#pdfAccordion">
                                    <div class="accordion-body">
                                        <embed src="assets/CHM1151syllabus.pdf" type="application/pdf" width="100%" height="500px">
                                    </div>
                                </div>
                            </div>
                            <!-- Button 5 -->
                            <div class="accordion-item">
                                <h2 class="accordion-header" id="headingSix">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#pdf5" aria-expanded="false" aria-controls="pdf5">
                                        General Chemistry Calendar
                                    </button>
                                </h2>
                                <div id="pdf5" class="accordion-collapse collapse" aria-labelledby="headingFive" data-bs-parent="#pdfAccordion">
                                    <div class="accordion-body">
                                        <embed src="assets/Expected Daily Class Schedule CHM 1151 for Spr 2025.pdf" type="application/pdf" width="100%" height="500px">
                                    </div>
                                </div>
                            </div>
                            <!-- Button 6 -->
                            <div class="accordion-item">
                                <h2 class="accordion-header" id="headingSix">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#pdf6" aria-expanded="false" aria-controls="pdf6">
                                        General Chemistry Lab Calendar
                                    </button>
                                </h2>
                                <div id="pdf6" class="accordion-collapse collapse" aria-labelledby="headingSix" data-bs-parent="#pdfAccordion">
                                    <div class="accordion-body">
                                        <embed src="assets/chemlabschedule.pdf" type="application/pdf" width="100%" height="500px">
                                    </div>
                                </div>
                            </div>
                        </div>
                    
                    <!-- Bootstrap JS -->
                    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
                </div>
            </div>
        <!-- Core theme JS-->
        <script src="js/scripts.js"></script>
    </body>
</html>
